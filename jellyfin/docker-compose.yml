services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config:/config
      - ../media:/data/media
      # ADDED: Explicitly maps transcoding to the physical disk to prevent RAM exhaustion
      - ../media/transcodes:/config/transcodes 
    ports:
      - "8096:8096/tcp"
    devices:
      - /dev/dri:/dev/dri
    # ADDED: Tells the host OS to never kill this container, even if RAM hits 99%
    oom_score_adj: -500 
    # ADDED: Hard ceiling of 1.5GB RAM, soft baseline of 512MB
    mem_limit: 1.5g
    mem_reservation: 512m
    restart: unless-stopped
