version: '3.8'

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config:/config
      - ../media:/data/media
    ports:
      - "8096:8096/tcp"
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
