version: '3.8'

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # We map qBittorrent's web UI port here on the VPN container
      - "8080:8080/tcp" 
      # We also map your AirVPN forwarded port here
      - "31562:31562/tcp"
      - "31562:31562/udp"
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=8FUbv3YjuK836IqmYXaYpiQo6nLFFn3AljJ4fEaiH3U=
      - WIREGUARD_PRESHARED_KEY=sjZpPm6E3610VwwfGn6CMq8A6z1H5edZPSRINYO1Zbs=
      - WIREGUARD_ADDRESSES=10.168.7.44/32
      - SERVER_COUNTRIES=United States # Change this to your preferred AirVPN country
      - FIREWALL_VPN_INPUT_PORTS=31562
      - TZ=America/Los_Angeles
    restart: unless-stopped
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8080
    volumes:
      - ./config:/config
      - ../media:/data/media # Shared media root for atomic folder moves later
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
