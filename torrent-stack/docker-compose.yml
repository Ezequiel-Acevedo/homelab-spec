services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080/tcp"
      - "31562:31562/tcp"
      - "31562:31562/udp"
      - "8888:8888/tcp"
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=8FUbv3YjuK836IqmYXaYpiQo6nLFFn3AljJ4fEaiH3U=
      - WIREGUARD_PRESHARED_KEY=sjZpPm6E3610VwwfGn6CMq8A6z1H5edZPSRINYO1Zbs=
      - WIREGUARD_ADDRESSES=10.168.7.44/32
      - WIREGUARD_MTU=1280
      - SERVER_COUNTRIES=United States
      - FIREWALL_VPN_INPUT_PORTS=31562
      - HTTPPROXY=on
      - TZ=America/Los_Angeles
    oom_score_adj: -500
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8080
    volumes:
      - ./config:/config
      - ../media:/data/media
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    mem_limit: 1g
    mem_reservation: 512m
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696/tcp"
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Los_Angeles
    ports:
      - "8191:8191/tcp"
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/radarr:/config
      - ../media:/data/media
    ports:
      - "7878:7878/tcp"
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/sonarr:/config
      - ../media:/data/media
    ports:
      - "8989:8989/tcp"
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/bazarr:/config
      - ../media:/data/media
    ports:
      - "6767:6767/tcp"
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "5055:5055/tcp"
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    user: 1000:1000
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./config/recyclarr:/config
    mem_limit: 128m
    mem_reservation: 64m
    restart: unless-stopped
